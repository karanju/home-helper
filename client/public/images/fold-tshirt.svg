<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#38bdf8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background card -->
  <rect width="400" height="300" rx="20" fill="url(#bgGrad)"/>
  
  <!-- Soft table surface -->
  <ellipse cx="200" cy="235" rx="140" ry="24" fill="#334155" opacity="0.6"/>

  <!-- Folded T-shirt body -->
  <g filter="url(#glow)">
    <!-- Base folded stack layer 1 (bottom) -->
    <rect x="120" y="160" width="160" height="60" rx="12" fill="#0369a1"/>
    
    <!-- Main folded rectangle (layer 2) -->
    <rect x="125" y="125" width="150" height="75" rx="12" fill="url(#shirtGrad)"/>
    
    <!-- Left folded sleeve wing -->
    <path d="M 125 135 L 105 165 C 103 172, 108 180, 115 180 L 125 180 Z" fill="#0284c7"/>
    
    <!-- Right folded sleeve wing -->
    <path d="M 275 135 L 295 165 C 297 172, 292 180, 285 180 L 275 180 Z" fill="#0284c7"/>

    <!-- T-Shirt Collar Ribbing -->
    <path d="M 170 125 C 170 142, 230 142, 230 125 Z" fill="#0f172a" opacity="0.5"/>
    <path d="M 172 125 C 172 138, 228 138, 228 125" stroke="#bae6fd" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- Cute smile badge on shirt -->
    <circle cx="200" cy="165" r="14" fill="#fbbf24"/>
    <circle cx="195" cy="163" r="2" fill="#78350f"/>
    <circle cx="205" cy="163" r="2" fill="#78350f"/>
    <path d="M 195 168 Q 200 173 205 168" stroke="#78350f" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Step indicators / Dotted fold arrows -->
  <path d="M 85 120 Q 110 100 135 120" stroke="#f59e0b" stroke-width="3" stroke-dasharray="5 4" fill="none"/>
  <polygon points="135,115 140,123 130,124" fill="#f59e0b"/>

  <path d="M 315 120 Q 290 100 265 120" stroke="#f59e0b" stroke-width="3" stroke-dasharray="5 4" fill="none"/>
  <polygon points="265,115 260,123 270,124" fill="#f59e0b"/>

  <!-- Sparkles -->
  <g fill="#fbbf24">
    <!-- Star 1 -->
    <path d="M 90 70 Q 90 80 80 80 Q 90 80 90 90 Q 90 80 100 80 Q 90 80 90 70 Z"/>
    <!-- Star 2 -->
    <path d="M 310 65 Q 310 75 300 75 Q 310 75 310 85 Q 310 75 320 75 Q 310 75 310 65 Z"/>
    <!-- Star 3 small -->
    <circle cx="290" cy="100" r="3" fill="#38bdf8"/>
    <circle cx="110" cy="105" r="3" fill="#38bdf8"/>
  </g>

  <!-- Banner text -->
  <rect x="130" y="32" width="140" height="28" rx="14" fill="#0284c7" opacity="0.3"/>
  <text x="200" y="51" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">STEP-BY-STEP FOLD</text>
</svg>

