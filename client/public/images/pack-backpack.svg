<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="packGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="pocketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f97316" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background card -->
  <rect width="400" height="300" rx="20" fill="url(#bgGrad2)"/>
  
  <!-- Floor shadow -->
  <ellipse cx="200" cy="245" rx="110" ry="20" fill="#334155" opacity="0.6"/>

  <!-- Backpack Body -->
  <g filter="url(#glow2)">
    <!-- Top Carry Handle -->
    <path d="M 170 85 C 170 65, 230 65, 230 85" stroke="#9a3412" stroke-width="8" fill="none" stroke-linecap="round"/>

    <!-- School Books sticking out of top -->
    <!-- Heavy Blue Book (Back) -->
    <rect x="145" y="70" width="110" height="70" rx="6" fill="#2563eb" transform="rotate(-6 200 100)"/>
    <rect x="147" y="72" width="16" height="66" rx="3" fill="#1d4ed8" transform="rotate(-6 200 100)"/>
    <line x1="160" y1="80" x2="235" y2="72" stroke="#93c5fd" stroke-width="3"/>

    <!-- Yellow Notebook (Middle) -->
    <rect x="160" y="80" width="95" height="60" rx="6" fill="#eab308" transform="rotate(4 200 110)"/>
    <circle cx="170" cy="95" r="3" fill="#a16207"/>
    <circle cx="170" cy="110" r="3" fill="#a16207"/>
    <circle cx="170" cy="125" r="3" fill="#a16207"/>

    <!-- Main Bag Dome Shape -->
    <path d="M 130 140 C 130 95, 270 95, 270 140 L 275 225 C 275 235, 265 240, 255 240 L 145 240 C 135 240, 125 235, 125 225 Z" fill="url(#packGrad)"/>

    <!-- Side Water Bottle Pocket (Left) -->
    <rect x="110" y="165" width="22" height="50" rx="8" fill="#c2410c"/>
    <rect x="114" y="150" width="14" height="25" rx="4" fill="#06b6d4" opacity="0.8"/>

    <!-- Front Zipper Pocket -->
    <rect x="145" y="165" width="110" height="65" rx="14" fill="url(#pocketGrad)"/>
    <!-- Pocket Zipper Line -->
    <path d="M 155 178 L 245 178" stroke="#7c2d12" stroke-width="3" stroke-linecap="round"/>
    <circle cx="200" cy="178" r="4" fill="#fed7aa"/>

    <!-- Cute Pencil Case / Ruler popping up -->
    <rect x="165" y="145" width="70" height="22" rx="6" fill="#10b981"/>
    <rect x="175" y="149" width="35" height="5" rx="2" fill="#a7f3d0"/>
  </g>

  <!-- Sparkles & Stars -->
  <g fill="#fbbf24">
    <path d="M 85 85 Q 85 95 75 95 Q 85 95 85 105 Q 85 95 95 95 Q 85 95 85 85 Z"/>
    <path d="M 315 80 Q 315 90 305 90 Q 315 90 315 100 Q 315 90 325 90 Q 315 90 315 80 Z"/>
    <circle cx="300" cy="125" r="4" fill="#f97316"/>
    <circle cx="95" cy="135" r="3" fill="#eab308"/>
  </g>

  <!-- Banner text -->
  <rect x="130" y="28" width="140" height="28" rx="14" fill="#ea580c" opacity="0.3"/>
  <text x="200" y="47" fill="#fed7aa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">PACKED &amp; READY</text>
</svg>
