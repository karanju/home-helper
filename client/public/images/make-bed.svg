<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blanketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#a855f7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="20" fill="url(#bgGrad4)"/>

  <!-- Bed Frame -->
  <g filter="url(#glow4)">
    <!-- Wooden Headboard -->
    <rect x="100" y="80" width="200" height="70" rx="10" fill="#78350f"/>
    <rect x="108" y="88" width="184" height="54" rx="6" fill="#92400e"/>

    <!-- Mattress Base -->
    <rect x="110" y="130" width="180" height="95" rx="14" fill="#f8fafc"/>

    <!-- Pillow Fluffy Top -->
    <rect x="135" y="115" width="130" height="40" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="200" cy="135" r="3" fill="#cbd5e1"/>

    <!-- Neatly Tucked Blanket (Folded Over Top) -->
    <path d="M 110 155 Q 200 162 290 155 L 290 225 L 110 225 Z" fill="url(#blanketGrad)"/>
    <!-- Folded Sheet Rim -->
    <path d="M 110 150 Q 200 158 290 150 L 290 160 Q 200 168 110 160 Z" fill="#e9d5ff"/>

    <!-- Star Pattern on Blanket -->
    <circle cx="160" cy="190" r="3" fill="#facc15"/>
    <circle cx="200" cy="180" r="4" fill="#facc15"/>
    <circle cx="240" cy="190" r="3" fill="#facc15"/>
    <circle cx="180" cy="205" r="3" fill="#facc15"/>
    <circle cx="220" cy="205" r="3" fill="#facc15"/>
  </g>

  <!-- Sparkles of Cleanliness -->
  <g fill="#fbbf24">
    <path d="M 85 80 Q 85 90 75 90 Q 85 90 85 100 Q 85 90 95 90 Q 85 90 85 80 Z"/>
    <path d="M 315 75 Q 315 85 305 85 Q 315 85 315 95 Q 315 85 325 85 Q 315 85 315 75 Z"/>
  </g>

  <!-- Banner text -->
  <rect x="130" y="30" width="140" height="28" rx="14" fill="#7e22ce" opacity="0.3"/>
  <text x="200" y="49" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">TIDY &amp; COZY BED</text>
</svg>

